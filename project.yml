# XcodeGen project spec — the .xcodeproj is generated from this at build time,
# so no Mac and no committed project file are needed.
name: KurdUnityLauncher
options:
  bundleIdPrefix: com.kurdunity
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

targets:
  KurdUnityLauncher:
    type: application
    platform: iOS
    sources:
      - path: Launcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurdunity.launcher
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Build unsigned so ESign can re-sign with your certificate.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CLANG_ENABLE_MODULES: YES
    info:
      path: Launcher/Info.plist
      properties:
        CFBundleDisplayName: KurdUnity Launcher
        CFBundleShortVersionString: "1.0"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - moonlight
          - steamlink
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
