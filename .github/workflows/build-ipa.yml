name: Build unsigned IPA

# Produces an unsigned KurdUnityLauncher.ipa on a cloud macOS runner.
# Download the artifact, then sign/install it on the iPhone with ESign.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build IPA
        run: bash build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KurdUnityLauncher-ipa
          path: KurdUnityLauncher.ipa
          if-no-files-found: error
